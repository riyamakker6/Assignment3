<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Feedback Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Student Feedback Form</h2>

    <form id="feedbackForm">
        <div class="input-group">
            <label>Student Name</label>
            <input type="text" id="name">
            <small class="error" id="nameError"></small>
        </div>

        <div class="input-group">
            <label>Email</label>
            <input type="email" id="email">
            <small class="error" id="emailError"></small>
        </div>

        <div class="input-group">
            <label>Course</label>
            <select id="course">
                <option value="">Select Course</option>
                <option>B.Tech CSE</option>
                <option>BCA</option>
                <option>MCA</option>
                <option>BBA</option>
                <option>MBA</option>
            </select>
            <small class="error" id="courseError"></small>
        </div>

        <div class="input-group">
            <label>Feedback</label>
            <textarea id="feedback" rows="5"></textarea>
            <small class="error" id="feedbackError"></small>
        </div>

        <button type="submit">Submit Feedback</button>
        <button type="button" id="deleteBtn">Delete Stored Data</button>
    </form>

    <div id="sessionUser"></div>

    <div class="display">
        <h3>Stored Feedback</h3>
        <div id="storedData">No feedback stored.</div>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
